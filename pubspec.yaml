name: acrova
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^6.0.1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  dio: ^5.9.2
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  get_it: ^9.2.1
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  logger: ^2.7.0
  shimmer: ^3.0.0
  go_router: ^17.2.2
  flutter_svg: ^2.2.4
  collection: ^1.19.1
  pretty_dio_logger: ^1.4.0
  toastification: ^3.0.3
  flutter_secure_storage: ^10.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_crashlytics: ^5.2.0
  device_info_plus: ^12.4.0
  shared_preferences: ^2.5.5
  infinite_scroll_pagination: ^5.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  flutter_alice: ^2.0.1
  alice_dio: ^1.0.7
  alice: ^1.0.0
  intl_phone_field: ^3.2.0
  phone_numbers_parser: ^9.0.21
  firebase_database: ^12.3.0
  pin_code_fields: ^9.4.0
  video_player: ^2.10.1
  chewie: ^1.13.1
  media_kit: ^1.2.6
  youtube_player_iframe: ^5.2.2
  media_kit_video: ^2.0.1
  syncfusion_flutter_pdfviewer: ^33.2.13
  photo_view: ^0.15.0
  share_plus: ^11.1.0
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true
  generate: true


  assets:
    - .env
    - assets/icons/
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/noto_serif/NotoSerif-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_serif/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_serif/NotoSerif-Bold.ttf
          weight: 700
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/ibm_plex_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
